services:
  ptt-dc-bot:
    image: ghcr.io/jasonxp516/ptt-dc-bot:latest
    build: .
    container_name: ptt-dc-bot
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD", "python3", "-c", "import os; exit(0 if os.path.exists('/app/data/bot_data.db') else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    env_file:
      - .env
    environment:
      - TZ=Asia/Taipei
      - DB_PATH=/app/data/bot_data.db
      - LOG_PATH=/app/data/bot.log
      - LOG_TO_STDOUT=1
    volumes:
      - ./data:/app/data
