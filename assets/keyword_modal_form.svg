<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 490" width="560" height="490">
  <defs>
    <style>
      .modal-bg { fill: #313338; stroke: #232428; stroke-width: 1; }
      .footer-bg { fill: #2B2D31; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 18px; font-weight: 700; fill: #F2F3F5; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 700; fill: #B5BAC1; text-transform: uppercase; letter-spacing: 0.02em; }
      .text-input-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 14px; fill: #F2F3F5; }
      .text-placeholder { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 14px; fill: #80848E; }
      .text-counter { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 11px; fill: #949BA4; text-anchor: end; }
      .input-box { fill: #1E1F22; stroke: #232428; stroke-width: 1; }
      .input-box-focus { fill: #1E1F22; stroke: #5865F2; stroke-width: 1.5; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
      .text-cancel { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 14px; font-weight: 500; fill: #DBDEE1; text-anchor: middle; cursor: pointer; }
    </style>
  </defs>

  <!-- Modal Main Container -->
  <rect width="560" height="490" rx="8" class="modal-bg" />

  <!-- Header -->
  <text x="28" y="38" class="text-title">新增追蹤關鍵字</text>
  <text x="532" y="38" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" fill="#949BA4" text-anchor="end" cursor="pointer">&#215;</text>

  <!-- Field 1: 追蹤關鍵字 (必填) [Active Focus] -->
  <text x="28" y="76" class="text-label">
    追蹤關鍵字 <tspan fill="#FA777C">*</tspan>
  </text>
  <rect x="28" y="86" width="504" height="40" rx="4" class="input-box-focus" />
  <text x="40" y="111" class="text-placeholder">例如: 3060Ti 或 3060 -筆電</text>
  <text x="520" y="111" class="text-counter">0/50</text>

  <!-- Field 2: 目標看板 -->
  <text x="28" y="152" class="text-label">目標看板 (選填，留空預設 HardwareSale)</text>
  <rect x="28" y="162" width="504" height="40" rx="4" class="input-box" />
  <text x="40" y="187" class="text-input-val">HardwareSale</text>
  <text x="520" y="187" class="text-counter">12/30</text>

  <!-- Field 3: 限定分類 -->
  <text x="28" y="228" class="text-label">限定分類 (選填，留空預設 賣)</text>
  <rect x="28" y="238" width="504" height="40" rx="4" class="input-box" />
  <text x="40" y="263" class="text-input-val">賣</text>
  <text x="520" y="263" class="text-counter">1/10</text>

  <!-- Field 4: 預算上限 -->
  <text x="28" y="304" class="text-label">預算上限 (新台幣整數，留空代表不限)</text>
  <rect x="28" y="314" width="504" height="40" rx="4" class="input-box" />
  <text x="40" y="339" class="text-placeholder">例如: 6500 (超過此金額自動不推播)</text>
  <text x="520" y="339" class="text-counter">0/15</text>

  <!-- Modal Footer -->
  <path d="M 0 380 L 560 380 L 560 482 A 8 8 0 0 1 552 490 L 8 490 A 8 8 0 0 1 0 482 Z" class="footer-bg" />
  <text x="400" y="426" class="text-cancel">取消</text>
  <rect x="444" y="402" width="88" height="38" rx="4" fill="#5865F2" />
  <text x="488" y="426" class="text-btn">提交</text>
</svg>
