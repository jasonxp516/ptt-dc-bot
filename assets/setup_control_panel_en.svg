<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" width="680" height="440">
  <defs>
    <style>
      .bg { fill: #313338; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .text-bot-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 15px; font-weight: 600; fill: #F2F3F5; }
      .text-time { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 12px; fill: #949BA4; }
      .text-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 12px; fill: #DBDEE1; }
      .text-muted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 12px; fill: #949BA4; }
      .text-submuted { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 11px; fill: #949BA4; }
      .text-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 600; fill: #B5BAC1; }
      .text-btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 12px; font-weight: 500; fill: #FFFFFF; text-anchor: middle; }
      .text-code { font-family: Consolas, 'Courier New', monospace; font-size: 11px; fill: #57F287; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="680" height="440" rx="8" />

  <!-- Bot Avatar -->
  <circle cx="36" cy="36" r="18" fill="#5865F2" />
  <text x="36" y="41" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PTT</text>

  <!-- Bot Message Header -->
  <text x="66" y="32" class="text-bot-name">PTT-DC-Bot</text>
  <rect x="160" y="19" width="38" height="18" rx="4" fill="#5865F2" />
  <text x="179" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">APP</text>
  <text x="210" y="32" class="text-time">Today at 11:20 PM</text>

  <!-- Embed Container -->
  <rect x="66" y="48" width="584" height="268" rx="4" fill="#2B2D31" />
  <!-- Left Accent Bar (#3498DB Blue) -->
  <path d="M 66 52 A 4 4 0 0 1 70 48 L 70 316 A 4 4 0 0 1 66 316 Z" fill="#3498DB" />

  <!-- Embed Content -->
  <text x="82" y="74" class="text-title">PTT Tracking Dispatch Control Center</text>
  
  <text x="82" y="97" class="text-desc">
    <tspan font-weight="600">Scope</tspan>: <tspan fill="#F2F3F5">[Server Tracking]</tspan>  |  <tspan font-weight="600">Lang</tspan>: <tspan fill="#F2F3F5">English (en)</tspan>
  </text>
  <text x="82" y="115" class="text-muted">Welcome to PTT Smart Tracker! Use this panel to bind notification channels,</text>
  <text x="82" y="131" class="text-muted">select monitored trading boards, add tracking keywords, and test alerts.</text>

  <!-- Field 1: Current Alert Target -->
  <text x="82" y="153" class="text-label">Current Alert Target</text>
  <text x="82" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif" font-size="12" fill="#F1C40F">[Notice] Not bound yet (click the button below to configure)</text>

  <!-- Field 2: Monitored Boards -->
  <text x="82" y="192" class="text-label">Monitored Boards (1/5)</text>
  <rect x="82" y="199" width="110" height="20" rx="3" fill="#1E1F22" />
  <text x="90" y="213" class="text-code">HardwareSale</text>

  <!-- Field 3: Configured Keywords -->
  <text x="260" y="192" class="text-label">Configured Keywords (0/10)</text>
  <text x="260" y="213" class="text-muted">No keywords configured (click below to add)</text>

  <!-- Field 4: Quick Setup Guide -->
  <text x="82" y="237" class="text-label">Quick Setup Guide</text>
  <text x="82" y="253" class="text-submuted">1. Click "Bind Channel" to set alert target  2. Select trading boards from dropdown</text>
  <text x="82" y="269" class="text-submuted">3. Click "Add Keyword" to set item &amp; budget  4. Click "Test Alert" to verify delivery</text>

  <!-- Footer -->
  <text x="82" y="297" class="text-submuted">PTT-DC-Bot /setup Interactive Panel • Language: English (en)</text>

  <!-- Row 0: Dropdown Placeholder -->
  <rect x="66" y="326" width="584" height="38" rx="4" fill="#2B2D31" stroke="#3F4147" stroke-width="1" />
  <text x="82" y="350" class="text-muted" font-size="13">Select Boards to Monitor (Multiple Allowed)...</text>
  <text x="632" y="350" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#949BA4" text-anchor="end">▼</text>

  <!-- Row 1: Action Buttons -->
  <!-- Button 1: Bind Channel (Blurple #5865F2) -->
  <rect x="66" y="376" width="254" height="38" rx="4" fill="#5865F2" />
  <text x="193" y="400" class="text-btn">Bind Channel</text>

  <!-- Button 2: Add Keyword (Green #248046) -->
  <rect x="328" y="376" width="168" height="38" rx="4" fill="#248046" />
  <text x="412" y="400" class="text-btn">Add Keyword</text>

  <!-- Button 3: Test Push (Grey #4E5058) -->
  <rect x="504" y="376" width="146" height="38" rx="4" fill="#4E5058" />
  <text x="577" y="400" class="text-btn">Test Alert</text>
</svg>
