<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330">
  <defs>
    <style>
      .bg { fill: #313338; }
      .select-box { fill: #2B2D31; stroke: #5865F2; stroke-width: 1.5; }
      .menu-bg { fill: #2B2D31; stroke: #3F4147; stroke-width: 1; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 500; fill: #F2F3F5; }
      .text-placeholder { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 13px; fill: #DBDEE1; }
      .text-item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 13px; font-weight: 600; fill: #F2F3F5; }
      .text-item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif; font-size: 11px; fill: #949BA4; }
      .row-selected { fill: #35373C; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="680" height="330" rx="8" />

  <!-- Active Select Box -->
  <rect x="48" y="16" width="584" height="38" rx="4" class="select-box" />
  <text x="64" y="40" class="text-placeholder">📋 快速選擇監控看板（可多選）...</text>
  <text x="614" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#F2F3F5" text-anchor="end">▲</text>

  <!-- Expanded Dropdown Menu -->
  <rect x="48" y="58" width="584" height="252" rx="4" class="menu-bg" />

  <!-- Option 1: HardwareSale (Selected) -->
  <rect x="52" y="62" width="576" height="46" rx="4" class="row-selected" />
  <!-- Checkbox (Checked) -->
  <rect x="66" y="76" width="18" height="18" rx="3" fill="#5865F2" />
  <polyline points="70,85 75,90 80,79" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="96" y="86" font-size="16">🖥️</text>
  <text x="124" y="84" class="text-item-title">HardwareSale</text>
  <text x="124" y="99" class="text-item-desc">電蝦二手 (電腦零件/周邊)</text>

  <!-- Option 2: MacShop -->
  <rect x="66" y="124" width="18" height="18" rx="3" fill="#1E1F22" stroke="#4E5058" stroke-width="1.5" />
  <text x="96" y="134" font-size="16">🍎</text>
  <text x="124" y="132" class="text-item-title">MacShop</text>
  <text x="124" y="147" class="text-item-desc">蘋果二手 (Apple 裝置/配件)</text>

  <!-- Option 3: nb-shopping -->
  <rect x="66" y="172" width="18" height="18" rx="3" fill="#1E1F22" stroke="#4E5058" stroke-width="1.5" />
  <text x="96" y="182" font-size="16">💻</text>
  <text x="124" y="180" class="text-item-title">nb-shopping</text>
  <text x="124" y="195" class="text-item-desc">筆電交易 (筆記型電腦/二手筆電)</text>

  <!-- Option 4: Gamesale -->
  <rect x="66" y="220" width="18" height="18" rx="3" fill="#1E1F22" stroke="#4E5058" stroke-width="1.5" />
  <text x="96" y="230" font-size="16">🎮</text>
  <text x="124" y="228" class="text-item-title">Gamesale</text>
  <text x="124" y="243" class="text-item-desc">遊戲交易 (遊戲片/主機周邊)</text>

  <!-- Option 5: MobileComm -->
  <rect x="66" y="268" width="18" height="18" rx="3" fill="#1E1F22" stroke="#4E5058" stroke-width="1.5" />
  <text x="96" y="278" font-size="16">📱</text>
  <text x="124" y="276" class="text-item-title">MobileComm</text>
  <text x="124" y="291" class="text-item-desc">手機通訊 (智慧手機/通訊設備)</text>
</svg>
